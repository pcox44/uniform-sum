<style>
:root {
  --bg: #eef2ff;
  --ink: #111827;
  --panel: #ffffff;
  --border: #111827;
  --muted: #4b5563;
  --blue: #1e3a8a;
}
* { box-sizing: border-box; }
body {
  margin: 24px;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--ink);
}
h1 {
  text-align: center;
  margin: 0;
  font-size: clamp(2.25rem, 5vw, 4.25rem);
  letter-spacing: -0.04em;
  line-height: 0.95;
}
.subtitle {
  text-align: center;
  color: var(--muted);
  margin: 10px auto 18px;
  font-weight: 800;
  max-width: 850px;
}
.hero {
  max-width: 1200px;
  margin: 0 auto 18px;
  padding: 24px 20px 20px;
  border: 3px solid var(--border);
  border-radius: 24px;
  background:
    radial-gradient(circle at top left, rgba(255,255,255,.90), rgba(255,255,255,.35) 34%, transparent 35%),
    linear-gradient(135deg, #fef3c7 0%, #dbeafe 42%, #ede9fe 100%);
  box-shadow: 0 8px 0 rgba(0,0,0,.20);
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: "AP Calculus • AB + BC";
  display: block;
  width: fit-content;
  margin: 14px auto 0;
  padding: 7px 13px;
  border: 2px solid var(--border);
  border-radius: 999px;
  background: white;
  color: var(--blue);
  font-weight: 950;
  font-size: .9rem;
  letter-spacing: .02em;
}
.controls {
  max-width: 1200px;
  margin: 0 auto 20px;
  background: var(--panel);
  border: 3px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 6px 0 rgba(0,0,0,.18);
}
.top-controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.mode-toggle {
  display: inline-flex;
  border: 2px solid var(--border);
  border-radius: 999px;
  overflow: hidden;
  background: #f3f4f6;
}
.mode-toggle button {
  border: 0;
  margin: 0;
  border-radius: 0;
  box-shadow: none;
}
.mode-toggle button.active {
  background: #111827;
  color: white;
}
button, select, input[type="number"], input[type="text"] {
  font: inherit;
}
button {
  margin: 5px;
  padding: 10px 16px;
  font-size: 1rem;
  font-weight: 800;
  border-radius: 10px;
  border: 2px solid black;
  cursor: pointer;
  background: white;
  box-shadow: 0 3px 0 rgba(0,0,0,.22);
}
button:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.22); }
.btn-green { background: #16a34a; color: white; }
.btn-red { background: #dc2626; color: white; }
.btn-purple { background: #7c3aed; color: white; }
.btn-orange { background: #f97316; color: white; }
.btn-blue { background: #2563eb; color: white; }
.btn-teal { background: #0f766e; color: white; }
.btn-pink { background: #db2777; color: white; }
.btn-gold { background: #ca8a04; color: white; }
.btn-slate { background: #334155; color: white; }
.btn-green:hover { background: #15803d; }
.btn-red:hover { background: #b91c1c; }
.btn-purple:hover { background: #6d28d9; }
.btn-orange:hover { background: #ea580c; }
.btn-blue:hover { background: #1d4ed8; }
.btn-teal:hover { background: #115e59; }
.btn-pink:hover { background: #be185d; }
.btn-gold:hover { background: #a16207; }
.btn-slate:hover { background: #1e293b; }
select, input[type="number"], input[type="text"] {
  padding: 7px;
  border: 2px solid #111827;
  border-radius: 8px;
  background: white;
  font-weight: 700;
}

.instructions {
  max-width: 960px;
  margin: 4px auto 14px;
  padding: 10px 12px;
  border: 2px dashed #111827;
  border-radius: 12px;
  background: #fff7ed;
  color: #1f2937;
  font-size: .92rem;
  font-weight: 750;
  line-height: 1.35;
}
.instructions strong { color: #111827; }

.quick-quiz input[type="text"] {
  width: 130px;
  text-align: center;
}

.unit-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-top: 12px;
}
.unit-control {
  border: 2px solid #111827;
  border-radius: 12px;
  padding: 10px;
  background: #f9fafb;
  display: grid;
  grid-template-columns: 1fr 64px;
  align-items: center;
  gap: 8px;
}
.unit-control label { font-weight: 800; }
.unit-control .small { color: var(--muted); font-size: .84rem; font-weight: 700; margin-top: 2px; }
.quiz {
  max-width: 1200px;
  margin: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.card {
  border: 3px solid black;
  padding: 20px;
  border-radius: 14px;
  font-size: 1.25rem;
  font-weight: 700;
  text-align: center;
  min-height: 150px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  box-shadow: 0 5px 0 rgba(0,0,0,.20);
}
.card .label {
  font-size: .82rem;
  letter-spacing: .04em;
  text-transform: uppercase;
  opacity: .9;
  margin-bottom: 10px;
}
.answer { background: #f8fafc; display: none; }
.show-answers .answer, .row.revealed .answer { display: flex; }
.question-card { cursor: pointer; }
.question-card:hover { filter: brightness(1.03); transform: translateY(-1px); }
.question-guidance { font-size: .95rem; margin-top: 10px; font-weight: 850; opacity: .92; }
.unit0 { background: #dc2626; color: white; }
.unit1 { background: #f97316; color: white; }
.unit2 { background: #7c3aed; color: white; }
.unit3 { background: #16a34a; color: white; }
.unit4 { background: #0284c7; color: white; }
.unit5 { background: #db2777; color: white; }
.unit6 { background: #0891b2; color: white; }
.unit7 { background: #65a30d; color: white; }
.unit8 { background: #ea580c; color: white; }
.unitBC { background: #0f766e; color: white; }
.unit9 { background: #9333ea; color: white; }
.unit10 { background: #ca8a04; color: white; }
.board-mode body, body.board-mode { margin: 18px; }
body.board-mode .controls { display: none; }
.board-home {
  display: none;
  position: sticky;
  top: 10px;
  z-index: 10;
  margin: 0 auto 14px;
  width: fit-content;
}
body.board-mode .board-home { display: block; }
body.board-mode h1 { font-size: 3.2rem; }
body.board-mode .subtitle { font-size: 1.35rem; }
body.board-mode .card { font-size: 2rem; min-height: 250px; padding: 34px; }
body.board-mode .card .label { font-size: 1rem; }
.bc-badge {
  display: inline-block;
  margin-left: 8px;
  padding: 2px 7px;
  border: 1.5px solid currentColor;
  border-radius: 999px;
  font-size: .68rem;
  font-weight: 950;
  letter-spacing: .04em;
}
.question-guidance {
  color: rgba(255,255,255,.95);
}
.answer .question-guidance { color: #374151; }

.print-area { display: none; }
.print-note { text-align:center; font-weight:900; margin: 12px auto; color:#4b5563; }

@media print {
  @page { size: letter portrait; margin: 0.25in; }
  html, body { background: white !important; margin: 0 !important; padding: 0 !important; color: black; }

  /* Prevent the visible home page from becoming a blank first printed page. */
  body > * { display: none !important; }
  body > .print-area { display: block !important; }

  .print-page {
    page-break-after: always;
    break-after: page;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(2, 1fr);
    gap: 1in;
    height: 10.5in;
    max-height: 10.5in;
    overflow: hidden;
    page-break-inside: avoid;
    break-inside: avoid;
  }
  .print-page:last-child { page-break-after: auto !important; break-after: auto !important; }
  .mini-quiz {
    border: 1.5px solid black;
    border-radius: 8px;
    padding: 0.10in;
    overflow: hidden;
    font-size: 9.6pt;
    line-height: 1.16;
    break-inside: avoid;
    page-break-inside: avoid;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .mini-quiz h2 {
    margin: 0 0 0.02in 0;
    text-align: center;
    font-size: 11pt;
    border-bottom: 1.2px solid black;
    padding-bottom: 0.018in;
  }
  .mini-quiz .quiz-title {
    display: block;
  }
  .mini-quiz .name-line {
    display: grid;
    grid-template-columns: 1fr 0.65fr;
    gap: 0.035in;
    margin-bottom: 0.075in;
    font-size: 8.2pt;
  }
  .mini-quiz ol {
    margin: 0;
    padding-left: 0.18in;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
  }
  .mini-quiz li { margin-bottom: 0.04in; }
  .mini-quiz strong { font-weight: 800; }
  .answer-line { border-bottom: 0.8px solid #444; height: 0.25in; margin-top: 0.035in; }
  .question-guidance { font-size: 8.2pt; margin-top: 0.008in; }
}

@media (max-width: 900px) {
  .unit-grid { grid-template-columns: 1fr; }
}

@media (max-width: 760px) {
  body { margin: 12px; }
  .row { grid-template-columns: 1fr; }
  .card { font-size: 1.08rem; }
}
</style>
</head>

<div class="hero" id="home">
  <h1>You Gotta Know</h1>
</div>


<div class="controls">
  <div class="top-controls">
    <span style="font-weight:900;">Course:</span>
    <div class="mode-toggle">
      <button id="abBtn" class="active" onclick="setMode('AB')">AB</button>
      <button id="bcBtn" onclick="setMode('BC')">BC</button>
    </div>
    <button class="btn-red" onclick="resetApp()">Reset</button>
    <button class="btn-purple" onclick="renderPrintPack()">Print 5 Quiz Pages</button>
  </div>

  <div class="instructions">

</div>

<div class="quiz" id="quiz"></div>

<script>
const decks = {
  "unit0": {
    "label": "Unit 0 – Prerequisite Knowledge",
    "cls": "unit0",
    "cards": [
      {
        "q": "For the unit circle, what are the coordinates/ratio for \\(\\sin\\theta\\), \\(\\cos\\theta\\), and \\(\\tan\\theta\\)?",
        "a": "\\(\\sin\\theta=y\\), \\(\\cos\\theta=x\\), and \\(\\tan\\theta=\\frac{y}{x}\\).",
      },
      {
        "q": "What are the reciprocal trig functions on the unit circle?",
        "a": "\\(\\sec\\theta=\\frac1x\\), \\(\\csc\\theta=\\frac1y\\), and \\(\\cot\\theta=\\frac{x}{y}\\).",
      },
      {
        "q": "State the Pythagorean identity.",
        "a": "\\(\\sin^2\\theta+\\cos^2\\theta=1\\).",
      },
      {
        "q": "What is \\(\\tan\\theta\\) in terms of sine and cosine?",
        "a": "\\(\\tan\\theta=\\frac{\\sin\\theta}{\\cos\\theta}\\).",
      },
      {
        "q": "Key trig values at \\(0\\) (sine, cosine, and tangent).",
        "a": "\\(\\sin 0=0\\), \\(\\cos 0=1\\), \\(\\tan 0=0\\).",
      },
      {
        "q": "Key trig values at \\(\\frac{\\pi}{2}\\) (sine, cosine, and tangent).",
        "a": "\\(\\sin\\frac{\\pi}{2}=1\\), \\(\\cos\\frac{\\pi}{2}=0\\), and \\(\\tan\\frac{\\pi}{2}\\) is undefined.",
      },
      {
        "q": "Key trig values at \\(\\pi\\). (sine, cosine, and tangent)",
        "a": "\\(\\sin\\pi=0\\), \\(\\cos\\pi=-1\\), and \\(\\tan\\pi=0\\).",
      },
      {
        "q": "Key trig values at \\(\\frac{3\\pi}{2}\\) (sine, cosine, and tangent).",
        "a": "\\(\\sin\\frac{3\\pi}{2}=-1\\), \\(\\cos\\frac{3\\pi}{2}=0\\), and \\(\\tan\\frac{3\\pi}{2}\\) is undefined.",
      },
      {
        "q": "When does \\(\\sin x=\\cos x\\) on \\(0\\le x<2\\pi\\)?",
        "a": "\\(x=\\frac{\\pi}{4}\\) and \\(x=\\frac{5\\pi}{4}\\).",
      },
      {
        "q": "Evaluate \\(e^0, e^1, \\ln(1), \\ln(e)\\).",
        "a": "\\(e^0=1\\), \\(e^1=e\\), \\(\\ln(1)=0\\), and \\(\\ln(e)=1\\).",
      },
      {
        "q": "Evaluate \\(4^{3/2}\\) and \\(8^{2/3}\\).",
        "a": "\\(4^{3/2}=8\\) and \\(8^{2/3}=4\\).",
      },
      {
        "q": "How many solutions does \\(a^x=0\\) have?",
        "a": "No solutions.",
      },
      {
        "q": "Give the three horizontal asymptote degree cases for rational functions.",
        "a": "Top heavy: no HA. Bottom heavy: \\(y=0\\). Same degree: \\(y=\\frac{\\text{LC}_N}{\\text{LC}_D}\\).",
      },
      {
        "q": "How do you tell vertical asymptote vs hole from a rational expression?",
        "a": "Denominator zero gives a possible issue. If the factor cancels, it is a hole. If it does not cancel, it is a vertical asymptote.",
      },
      {
        "q": "Factor using difference of squares: \\(x^2-c^2\\).",
        "a": "\\(x^2-c^2=(x+c)(x-c)\\).",
      },
      {
        "q": "Factor using GCF: \\(x^2+bx\\).",
        "a": "\\(x^2+bx=x(x+b)\\).",
      },
      {
        "q": "What are the formulas for slope between two points and average rate of change?",
        "a": "Slope: \\(m=\\frac{y_2-y_1}{x_2-x_1}\\). Average rate of change: \\(\\text{AROC}=\\frac{f(b)-f(a)}{b-a}\\).",
      },
      {
        "q": "Slope-intercept form of a line",
        "a": "\\(y=mx+b\\).",
      },
      {
        "q": "Point-slope form of a line",
        "a": "\\(y-y_1=m(x-x_1)\\).",
      },
      {
        "q": "Horizontal line equation",
        "a": "\\(y=c\\).",
      },
      {
        "q": "Vertical line equation",
        "a": "\\(x=c\\).",
      },
      {
        "q": "What are the basic area formulas?",
        "a": "Triangle: \\(A=\\frac12bh\\). Rectangle: \\(A=bh\\). Trapezoid: \\(A=\\frac12(b_1+b_2)h\\). Circle: \\(A=\\pi r^2\\).",
      },
      {
        "q": "What are the basic volume formulas?",
        "a": "Cylinder: \\(V=\\pi r^2h\\). Cone: \\(V=\\frac13\\pi r^2h\\). Sphere: \\(V=\\frac43\\pi r^3\\). Cube: \\(V=s^3\\).",
      },
      {
        "q": "Rewrite using log properties: \\(\\ln x+\\ln y\\) and \\(\\ln x-\\ln y\\).",
        "a": "\\(\\ln x+\\ln y=\\ln(xy)\\) and \\(\\ln x-\\ln y=\\ln\\left(\\frac{x}{y}\\right)\\).",
      },
      {
        "q": "Rewrite using the log power property: \\(n\\ln x\\).",
        "a": "\\(n\\ln x=\\ln(x^n)\\).",
      },
      {
        "q": "Rewrite using exponent properties: \\(a^m a^n\\) and \\(\\frac{a^m}{a^n}\\).",
        "a": "\\(a^m a^n=a^{m+n}\\) and \\(\\frac{a^m}{a^n}=a^{m-n}\\).",
      },
      {
        "q": "Rewrite using exponent properties: \\(a^{-n}\\) and \\(a^0\\).",
        "a": "\\(a^{-n}=\\frac{1}{a^n}\\) and \\(a^0=1\\).",
      },
      {
        "q": "Rewrite using exponent properties: \\(a^{1/n}\\) and \\((a^m)^n\\).",
        "a": "\\(a^{1/n}=\\sqrt[n]{a}\\) and \\((a^m)^n=a^{mn}\\).",
      },
      {
        "q": "For a function \\(f\\), what do increasing, decreasing, concave up, and concave down mean graphically? (4 answers)",
        "a": "Increasing rises left to right. Decreasing falls left to right. Concave up is a smile. Concave down is a frown.",
      },
      {
        "q": "What is a point of inflection for \\(f\\)?",
        "a": "A point where the concavity of \\(f\\) changes.",
      },
      {
        "q": "What are even and odd function tests for \\(f\\)?",
        "a": "Even: \\(f(-x)=f(x)\\). Odd: \\(f(-x)=-f(x)\\).",
      },
      {
        "q": "What is true for inverse functions?",
        "a": "If \\(f\\) and \\(g\\) are inverses, then \\(f(g(x))=x\\) and \\(g(f(x))=x\\).",
      }
    ]
  },
  "unit1": {
    "label": "Unit 1 – Limits & Continuity",
    "cls": "unit1",
    "cards": [
      {
        "q": "When does \\(\\dlim_{x\\to c}f(x)\\) exist?",
        "a": "When \\(\\dlim_{x\\to c^-}f(x)=\\dlim_{x\\to c^+}f(x)=L\\).",
      },
      {
        "q": "What are the three conditions for \\(f\\) to be continuous at \\(x=c\\)?",
        "a": "1. \\(f(c)\\) exists. 2. \\(\\dlim_{x\\to c}f(x)\\) exists. 3. \\(\\dlim_{x\\to c}f(x)=f(c)\\).",
      },
      {
        "q": "What is a removable discontinuity of \\(f\\)?",
        "a": "A hole: \\(\\dlim_{x\\to c}f(x)\\) exists, but \\(f(c)\\) does not exist or does not equal the limit.",
      },
      {
        "q": "What is a non-removable discontinuity of \\(f\\)?",
        "a": "A jump or vertical asymptote: one-sided limits disagree, one/both limits DNE, or one/both are \\(\\pm\\infty\\).",
      },
      {
        "q": "What does a vertical asymptote at \\(x=c\\) mean as a limit?",
        "a": "\\(\\dlim_{x\\to c}f(x)=\\pm\\infty\\) from at least one side.",
      },
      {
        "q": "What does a horizontal asymptote \\(y=L\\) mean as a limit?",
        "a": "\\(\\dlim_{x\\to\\pm\\infty}f(x)=L\\).",
      },
      {
        "q": "State the Intermediate Value Theorem for \\(f\\).",
        "a": "If \\(f\\) is continuous on \\([a,b]\\) and \\(N\\) is between \\(f(a)\\) and \\(f(b)\\), then there is some \\(c\\in(a,b)\\) such that \\(f(c)=N\\).",
      },
      {
        "q": "State the Squeeze Theorem for \\(f\\).",
        "a": "If \\(g(x)\\le f(x)\\le h(x)\\) and \\(\\dlim_{x\\to c}g(x)=\\dlim_{x\\to c}h(x)=L\\), then \\(\\dlim_{x\\to c}f(x)=L\\).",
      },
      {
        "q": "Order these by growth rate from slowest to fastest:  \\(x!\\), \\(x^n\\), \\(\\log x\\),  \\(x^x\\) , \\(a^x\\) .",
        "a": "\\(\\log x < x^n < a^x < x! < x^x\\).",
      }
    ]
  },
  "unit2": {
    "label": "Unit 2 – Derivative Definition & Rules",
    "cls": "unit2",
    "cards": [
      {
        "q": "State the limit definition of \\(f'\\).",
        "a": "\\(f'(x)=\\dlim_{h\\to0}\\frac{f(x+h)-f(x)}{h}\\).",
      },
      {
        "q": "State the alternate definition of \\(f'\\) at \\(x=c\\).",
        "a": "\\(f'(c)=\\dlim_{x\\to c}\\frac{f(x)-f(c)}{x-c}\\).",
      },
      {
        "q": "What does differentiability of \\(f\\) imply?",
        "a": "If \\(f\\) is differentiable, then \\(f\\) is continuous. Continuity does not guarantee differentiability.",
      },
      {
        "q": "Where is a function \\(f\\) not differentiable? (3 answers)",
        "a": "At discontinuities, cusps/corners, and vertical tangents.",
      },
      {
        "q": "State the Power Rule for \\(\\frac{d}{dx}[x^n]\\).",
        "a": "\\(\\frac{d}{dx}[x^n]=nx^{n-1}\\).",
      },
      {
        "q": "State the Product Rule for \\(\\frac{d}{dx}[fg]\\).",
        "a": "\\(\\frac{d}{dx}[fg]=f'g+fg'\\).",
      },
      {
        "q": "State the Quotient Rule for \\(\\frac{d}{dx}\\left(\\frac{f}{g}\\right)\\).",
        "a": "\\(\\frac{d}{dx}\\left(\\frac{f}{g}\\right)=\\frac{gf'-fg'}{g^2}\\).",
      },
      {
        "q": "Derivative of \\(\\sin x\\), \\(\\cos x\\), and \\(\\tan x\\).",
        "a": "\\((\\sin x)'=\\cos x\\), \\((\\cos x)'=-\\sin x\\), and \\((\\tan x)'=\\sec^2x\\).",
      },
      {
        "q": "Derivative of \\(e^x\\) and \\(\\ln x\\).",
        "a": "\\((e^x)'=e^x\\) and \\((\\ln x)'=\\frac1x\\).",

let currentMode = "AB";
const unitOrderAB = ["unit0","unit1","unit2","unit3","unit4","unit5","unit6","unit7","unit8"];
const unitOrderBC = ["unit0","unit1","unit2","unit3","unit4","unit5","unit6","unit7","unit8","unit9","unit10"];

function activeUnitKeys() { return currentMode === "AB" ? unitOrderAB : unitOrderBC; }

function unitSortIndex(key) {
  const keys = unitOrderBC.includes(key) ? unitOrderBC : activeUnitKeys();
  const index = keys.indexOf(key);
  return index === -1 ? 999 : index;
}

function sortSelectionsByUnit(selections) {
  return [...selections].sort((a, b) => unitSortIndex(a.key) - unitSortIndex(b.key));
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById("abBtn").classList.toggle("active", mode === "AB");
  document.getElementById("bcBtn").classList.toggle("active", mode === "BC");
  const hint = document.getElementById("bcStudyHint");
  if (hint) hint.style.display = mode === "BC" ? "inline" : "none";
  sanitizeQuickQuizInput();
}

function buildControls() {
  const hint = document.getElementById("bcStudyHint");
  if (hint) hint.style.display = currentMode === "BC" ? "inline" : "none";
}

function shuffle(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function pick(arr, n) { return shuffle(arr).slice(0, Math.min(n, arr.length)); }

function cardWithMeta(key, card) {
  const deck = decks[key];
  return { ...card, key, cls: deck.cls, label: deck.label };
}

function visibleCards(key) {
  return decks[key].cards.filter(card => !card.bcOnly || currentMode === "BC");
}

function tokenToKey(token) {
  const raw = String(token || "").trim();
  if (!raw) return null;
  if (!/^\d+$/.test(raw)) return null;
  const unitNum = Number(raw);
  return `unit${unitNum}`;
}

function cleanUnitInput(raw) {
  return String(raw || "")
    .toLowerCase()
    .replace(/units?/g, "")
    .replace(/[–—]/g, "-")
    .replace(/\s+/g, "")
    .trim();
}

function parseQuickQuizUnits() {
  const input = document.getElementById("quickQuizUnits");
  const cleaned = cleanUnitInput(input?.value || "0");
  const pieces = cleaned.split(/[,;]/).filter(Boolean);
  const keys = [];

  pieces.forEach(piece => {
    const range = piece.match(/^(\d+)-(\d+)$/);
    if (range) {
      const start = Number(range[1]);
      const end = Number(range[2]);
      const step = start <= end ? 1 : -1;
      for (let n = start; step > 0 ? n <= end : n >= end; n += step) {
        const key = tokenToKey(String(n));
        if (key && activeUnitKeys().includes(key) && !keys.includes(key)) keys.push(key);
      }
    } else {
      const key = tokenToKey(piece);
      if (key && activeUnitKeys().includes(key) && !keys.includes(key)) keys.push(key);
    }
  });

  return keys.length ? keys : ["unit0"];
}

function sanitizeQuickQuizInput() {
  const input = document.getElementById("quickQuizUnits");
  if (!input) return;
  parseQuickQuizUnits();
}

function getQuizSelections(maxQuestions = 5) {
  const unitKeys = parseQuickQuizUnits();
  const chosenUnitKeys = [];

  if (unitKeys.length === 1) {
    for (let i = 0; i < maxQuestions; i++) chosenUnitKeys.push(unitKeys[0]);
  } else if (unitKeys.length >= maxQuestions) {
    chosenUnitKeys.push(...shuffle(unitKeys).slice(0, maxQuestions));
  } else {
    while (chosenUnitKeys.length < maxQuestions) {
      chosenUnitKeys.push(...shuffle(unitKeys));
    }
    chosenUnitKeys.length = maxQuestions;
  }

  const usedByUnit = {};
  const selections = [];
  chosenUnitKeys.forEach(key => {
    if (!usedByUnit[key]) usedByUnit[key] = [];
    const cards = visibleCards(key);
    const available = cards.filter(card => !usedByUnit[key].includes(card));
    const pool = available.length ? available : cards;
    const card = pick(pool, 1)[0];
    usedByUnit[key].push(card);
    selections.push(cardWithMeta(key, card));
  });

  return sortSelectionsByUnit(selections);
}

function renderCards(selections) {
  const quiz = document.getElementById("quiz");
  quiz.classList.remove("show-answers");
  quiz.innerHTML = "";

  if (selections.length === 0) {
    quiz.innerHTML = `<div class="card answer" style="display:flex;"><strong>Choose a unit or unit range, then generate.</strong></div>`;
    return;
  }

  selections.forEach((item, i) => {
    const prompt = guidedPrompt(item);
    const bcBadge = item.bcOnly ? `<span class="bc-badge">BC ONLY</span>` : "";
    quiz.innerHTML += `
      <div class="row">
        <div class="card question-card ${item.cls}" onclick="this.closest('.row').classList.toggle('revealed')">
          <div class="label">Problem ${i + 1} • ${item.label}${bcBadge}</div>
          <div>${prompt}</div>
        </div>
        <div class="card answer">
          <div class="label">Answer</div>
          <div>${item.a}</div>
        </div>
      </div>`;
  });

  if (window.MathJax) MathJax.typesetPromise();
}

function guidedPrompt(item) {
  const q = typeof item === "string" ? item : item.q;
  const hint = typeof item === "string" ? "" : (item.hint || "");
  return hint ? `${q}<div class="question-guidance">${hint}</div>` : q;
}

function printablePrompt(item) {
  return guidedPrompt(item)
    .replace(/<div class="question-guidance">Hint: /g, '<br><em>')
    .replace(/<\/div>/g, '</em>');
}

function getPrintableSelections() {
  return getQuizSelections(5);
}

function unitShortLabel(item) {
  const match = item.label.match(/^Unit\s+([0-9]+)/);
  if (match) return `Unit ${match[1]}`;
  if (item.key === "unit0") return "Unit 0";
  return item.label.replace(/\s*[–-]\s*.*/, "");
}

function unitsCoveredText(selections) {
  const labels = [];
  sortSelectionsByUnit(selections).forEach(item => {
    const label = unitShortLabel(item);
    if (!labels.includes(label)) labels.push(label);
  });
  return labels.join(", ");
}

function renderPrintPack() {
  const printArea = document.getElementById("printArea");
  printArea.innerHTML = "";
  const pages = 5;
  const quizzesPerPage = 4;
  for (let p = 1; p <= pages; p++) {
    let pageHTML = `<div class="print-page">`;
    for (let qz = 1; qz <= quizzesPerPage; qz++) {
      const selections = getPrintableSelections();
      pageHTML += `<section class="mini-quiz">
        <h2><span class="quiz-title"><span>You Gotta Know Quiz</span></span></h2>
        <div class="name-line"><span>Name: ____________________</span><span>Score: _____ / 5</span></div>
        <ol>`;
      selections.forEach(item => {
        pageHTML += `<li><strong>${item.label.replace("Unit 0 – Prerequisite Knowledge", "Prerequisite Knowledge")}</strong>: ${printablePrompt(item)}<div class="answer-line"></div></li>`;
      });
      pageHTML += `</ol></section>`;
    }
    pageHTML += `</div>`;
    printArea.innerHTML += pageHTML;
  }

  if (window.MathJax) {
    MathJax.typesetPromise([printArea]).then(() => window.print());
  } else {
    window.print();
  }
}

function generateQuiz() { renderCards(getQuizSelections(5)); }

function resolveStudyUnit(input) {
  const raw = String(input || "").trim();
  if (!raw) return null;
  const unitNumber = Number(raw);
  if (!Number.isFinite(unitNumber)) return null;
  if (Number.isInteger(unitNumber)) return `unit${unitNumber}`;
  return null;
}

function studyTypedUnit() {
  const input = document.getElementById("studyUnitInput").value;
  const key = resolveStudyUnit(input);
  const quiz = document.getElementById("quiz");

  if (!key || !activeUnitKeys().includes(key)) {
    quiz.classList.remove("show-answers");
    const msg = currentMode === "BC"
      ? "Type a visible BC unit number."
      : "Type a visible AB unit number, or switch to BC for BC-only cards in Units 6-10.";
    quiz.innerHTML = `<div class="card answer" style="display:flex;"><strong>${msg}</strong></div>`;
    return;
  }

  const selections = visibleCards(key).map(card => cardWithMeta(key, card));
  renderCards(selections);
}


function studyAllCards(mode) {
  setMode(mode);
  const selections = activeUnitKeys().flatMap(key => visibleCards(key).map(card => cardWithMeta(key, card)));
  renderCards(sortSelectionsByUnit(selections));
}

function resetApp() {
  setMode("AB");
  const quickInput = document.getElementById("quickQuizUnits");
  if (quickInput) quickInput.value = "0";
  const studyInput = document.getElementById("studyUnitInput");
  if (studyInput) studyInput.value = "0";
  generateQuiz();
}

buildControls();
resetApp();
</script>
